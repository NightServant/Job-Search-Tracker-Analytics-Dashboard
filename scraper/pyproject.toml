[project]
name = "worktrack-extractor"
version = "0.1.0"
description = "Job posting extraction for Worktrack's Auto-fill button."
requires-python = ">=3.12"

# PINNED EXACTLY, and that is the mitigation for the one real risk in choosing
# Scrapling: it is 0.4.15, pre-1.0, and its API can move. The other half of the
# mitigation is the boundary in extractor/core.py -- Scrapling types never
# leave that module, so an upgrade is a diff in one file rather than a hunt.
#
# THE `[fetchers]` EXTRA IS NOW REQUIRED, reversing the note that stood here.
#
# It used to say the browser fetchers were hundreds of MB for a browser this
# lane never opens. That was true until 2026-09-06, when two of the sites Gabe
# actually applies through turned out to be unreadable without one:
#
#   Cloudstaff  110KB of HTML containing FIFTEEN visible characters. Every
#               posting is rendered client-side, so httpx sees an empty shell.
#   JobStreet   403 "Just a moment" to httpx; 200 and the real page to an
#               ordinary headless browser. The challenge is aimed at clients
#               that cannot run the page.
#
# httpx is still the FIRST attempt and still handles most pages. The browser
# opens only when the static fetch comes back as a shell or a challenge --
# see app.py::_render.
#
# DEPLOYMENT COST, stated plainly: this adds curl_cffi, playwright and
# browserforge, plus a Chromium download (~95MB compressed) that must happen at
# BUILD time -- `playwright install chromium` does not run itself. Vercel
# functions cap at 5GB so it fits, but the extractor's cold start will be
# slower and the build longer. If that proves unworkable on Hobby, the fallback
# is the caller supplying HTML from their own browser, which `/extract` already
# accepts and which needs none of this.
dependencies = [
  "scrapling[fetchers]==0.4.15",
  "playwright>=1.40",
  "httpx>=0.27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
