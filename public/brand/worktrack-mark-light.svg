<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 23 23" role="img" aria-label="Worktrack">
  <!-- For LIGHT backgrounds. neutral-900 cells with accent-700, the exact pair
       the app resolves to in its light theme. Geometry is copied from
       src/app/icon.svg and src/components/ui/brand-mark.tsx, not redrawn: four
       10x10 cells on a 23-unit grid with a 3-unit gutter and a 1-unit radius.
       The bottom-left cell is the accent, a literal reference to one stage of
       the status pipeline being active.

       This file exists ONLY for the README. The app's own mark needs no light
       and dark variants, because its three static cells use currentColor and
       its accent cell binds to a CSS custom property, so it follows the theme
       by itself. An img on GitHub gets neither a CSS context nor an inherited
       colour, so the two themes need two files and a picture element to pick
       between them.

       EDITING THIS COMMENT: an SVG is parsed as strict XML, where a comment may
       not contain a double hyphen ANYWHERE. Both brand marks once did, in prose
       and in a CSS variable name, and both failed to decode: GitHub rendered alt
       text where the logo should have been, for as long as the files existed.
       Keep every hyphen in here single. svgWellFormed.test.ts now fails if this
       is broken again. -->
  <rect x="0"  y="0"  width="10" height="10" rx="1" fill="#18181b"/>
  <rect x="13" y="0"  width="10" height="10" rx="1" fill="#18181b"/>
  <rect x="0"  y="13" width="10" height="10" rx="1" fill="#c2410c"/>
  <rect x="13" y="13" width="10" height="10" rx="1" fill="#18181b"/>
</svg>
