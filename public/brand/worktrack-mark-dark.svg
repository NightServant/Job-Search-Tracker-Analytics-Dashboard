<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 23 23" role="img" aria-label="Worktrack">
  <!-- For DARK backgrounds. neutral-50 cells with accent-400, because accent-700
       fails contrast on near-black, which is why the app swaps to accent-400 in
       dark mode too. Geometry is identical to the light mark; only the fills
       differ.

       This file exists ONLY for the README. See worktrack-mark-light.svg for why
       two files are needed at all, and for the XML comment rule that once broke
       both of them. Keep every hyphen in here single. -->
  <rect x="0"  y="0"  width="10" height="10" rx="1" fill="#fafafa"/>
  <rect x="13" y="0"  width="10" height="10" rx="1" fill="#fafafa"/>
  <rect x="0"  y="13" width="10" height="10" rx="1" fill="#fb923c"/>
  <rect x="13" y="13" width="10" height="10" rx="1" fill="#fafafa"/>
</svg>
